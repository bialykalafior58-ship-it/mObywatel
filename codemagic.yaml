workflows:
  build-designsystem:
    name: Build Design System
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Build
        script: |
          cd iOS
          echo "=== Zawartość folderu iOS ==="
          ls -la
          
          echo "=== Próbuję budować ==="
          cd App
          
          xcodebuild build \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ../../build
    artifacts:
      - "**/*.app"
      - "**/*.ipa"
      - "build/**"