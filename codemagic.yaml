workflows:
  build-designsystem:
    name: Build Design System
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Build
        script: |
          cd iOS
          ls -la
          
          # Jeśli jest .xcodeproj
          if [ -d "App/App.xcodeproj" ]; then
            echo "Znaleziono Xcode project"
            xcodebuild build \
              -project App/App.xcodeproj \
              -scheme App \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO
          else
            echo "Brak .xcodeproj - budujemy Package"
            cd App
            xcodebuild build \
              -scheme App \
              -sdk iphoneos \
              -configuration Release \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO
          fi
    artifacts:
      - path: "**/*.app"
      - path: "**/*.ipa"
      - path: "**/build/**"