workflows:
  build-mobywatel:
    name: Build mObywatel
    instance_type: mac_mini_m2
    max_build_duration: 60
    environment:
      xcode: latest
    scripts:
      - name: Build
        script: |
          cd iOS
          echo "=== Zawartość iOS ==="
          ls -la
          
          echo "=== Próbuję budować ==="
          cd App || cd .
          
          xcodebuild build \
            -scheme App \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath ../../build || echo "Build failed but continuing..."
    artifacts:
      - "**/*.app"
      - "**/*.ipa"
      - "build/**"